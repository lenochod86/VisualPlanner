services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # produkční build: docker compose --profile prod up --build prod
  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"

volumes:
  node_modules:
