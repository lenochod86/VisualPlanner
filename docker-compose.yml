services:
  web:
    build: { context: ./web, target: dev }
    ports: ["5173:5173"]
    environment:
      API_URL: http://api:3001
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]

  api:
    build: { context: ./server, target: dev }
    ports: ["3001:3001"]
    environment:
      DATA_DIR: /data
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"      # pollování po sekundě (výchozích 100 ms zbytečně zatěžuje CPU)
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules
      - ./data:/data

  # Produkční varianta: docker compose --profile prod up --build web-prod api-prod  ->  http://localhost:8080
  web-prod:
    profiles: ["prod"]
    build: { context: ./web, target: prod }
    ports: ["8080:80"]
    depends_on: [api-prod]

  api-prod:
    profiles: ["prod"]
    build: { context: ./server, target: prod }
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data

volumes:
  web_node_modules:
  api_node_modules:
