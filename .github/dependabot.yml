version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
    commit-message: { prefix: Update }

  - package-ecosystem: npm
    directories: [/web, /server]
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: Update }
